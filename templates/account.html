{% extends 'base.html' %}{% block title %}My account{% endblock %}{% block body %}
<h1>My account</h1>
<div class="grid2 even">
  <form method="post" class="card">
    <h2>Change my password</h2><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="action" value="password">
    <label>Current password<input type="password" name="current" required autocomplete="current-password"></label>
    <label>New password <small>(at least 8 characters)</small><input type="password" name="new" minlength="8" required autocomplete="new-password"></label>
    <button class="btn btn-hot" type="submit">Change password</button>
  </form>
  <div class="card">
    <h2>People with access</h2>
    <div class="rows">{% for u in users %}<div class="row"><b>{{ u.user }}</b>{% if u.user != user %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="action" value="remove"><input type="hidden" name="username" value="{{ u.user }}"><button class="btn btn-danger sm" data-confirm="Remove access for {{ u.user }}?">Remove</button></form>{% else %}<span class="muted">(you)</span>{% endif %}</div>{% endfor %}</div>
    <form method="post"><h3>Give someone else access</h3><input type="hidden" name="_csrf" value="{{ csrf }}"><input type="hidden" name="action" value="add">
      <label>Username<input name="username" required></label><label>Password <small>(at least 8 characters)</small><input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn btn-ghost" type="submit">Create user</button></form>
  </div>
</div>
{% endblock %}
