{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block body %}
<div class="card narrow">
  <div class="logo big"><b>HMG</b><span>Panel</span></div>
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label>Username<input name="username" required autofocus autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-hot wide" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
